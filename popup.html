<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .description {
      font-size: 12px;
      color: #888;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid #333;
    }
    .toggle-row label {
      font-size: 14px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider {
      background: #0095f6;
    }
    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AntiIG</h1>
  </div>
  <p class="description">
    Filters your Instagram feed to only show posts from people you follow.
    Hides suggested posts, ads, and explore content.
  </p>
  <div class="toggle-row">
    <label for="toggle">Filter enabled</label>
    <div class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </div>
  </div>
  <p class="status" id="status">Filtering active</p>
  <script src="popup.js"></script>
</body>
</html>
